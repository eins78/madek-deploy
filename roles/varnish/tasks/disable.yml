# reverse-proxy.yml has already removed the Apache file, so Apache never
# points at a stopped Varnish. The package stays installed.
- name: stop varnish service
  service:
    name: varnish
    state: stopped
    enabled: no
  failed_when: false

- name: remove varnish config files
  file:
    path: "{{ item }}"
    state: absent
  with_items:
    - /etc/systemd/system/varnish.service.d/madek.conf
    - /etc/varnish/madek.vcl
  register: varnish_config_removed

- name: reload systemd
  systemd:
    daemon_reload: yes
  when: varnish_config_removed.changed
