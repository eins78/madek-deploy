# Managed with ansible - Varnish shared cache for anonymous requests
#
# Varnish sits between Apache and the Madek webapp. Service paths (/admin, /api,
# /api-v2, /auth) are proxied by their own conf files at priority 800. With
# Anubis enabled, its catch-all (895) wins and Anubis forwards to Varnish
# (anubis_target), so this file's catch-all is not reached.


###############################################################################
### Static asset exclusions ###################################################
###############################################################################

# Static assets: served by Apache (Alias in madek_900_webapp.conf)
ProxyPass /assets !


###############################################################################
### Direct to the webapp ######################################################
###############################################################################

# Machine callbacks, oEmbed and binary downloads go straight to the webapp
# (same list as madek_895_anubis.conf): never stored, X-Sendfile path unchanged.
ProxyPassMatch ^/zencoder_jobs/(.*)$ http://127.0.0.1:{{ madek_webapp_port }}/zencoder_jobs/$1 nocanon retry=1
ProxyPassMatch ^/oembed\.(json|xml)$ http://127.0.0.1:{{ madek_webapp_port }}/oembed.$1 nocanon retry=1
ProxyPassMatch ^(/entries/[0-9a-f-]{36}/(?:image\.jpg|video\.(?:mp4|webm)|audio\.(?:mp3|ogg)|document\.pdf)(?:\?.*)?)$ http://127.0.0.1:{{ madek_webapp_port }}$1 nocanon retry=1
ProxyPassMatch ^(/media/[0-9a-f-]{36}(?:\.[^/?]*)?(?:\?.*)?)$ http://127.0.0.1:{{ madek_webapp_port }}$1 nocanon retry=1
ProxyPassMatch ^(/files/[0-9a-f-]{36}(?:\.[^/?]*)?(?:\?.*)?)$ http://127.0.0.1:{{ madek_webapp_port }}$1 nocanon retry=1


###############################################################################
### Varnish catch-all proxy ###################################################
###############################################################################

# Everything else goes through Varnish. This must come AFTER the service confs
# (800) and Anubis (895) and BEFORE the webapp catch-all (900); the webapp file
# stays unchanged.
ProxyPassMatch ^/(.*)$ http://127.0.0.1:{{ varnish_port }}/$1 nocanon retry=1
ProxyPassReverse / http://127.0.0.1:{{ varnish_port }}/


# vim: syntax=apache
