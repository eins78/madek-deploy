# Managed with ansible - Varnish in front of the Madek webapp
[Service]
ExecStart=
ExecStart=/usr/sbin/varnishd -j unix,user=vcache -F \
  -a 127.0.0.1:{{ varnish_port }} -T 127.0.0.1:{{ varnish_admin_port }} -S /etc/varnish/secret \
  -f /etc/varnish/madek.vcl \
  -s malloc,{{ varnish_storage_size }} -s Transient=malloc,{{ varnish_transient_size }}{% for k, v in varnish_params.items() %} \
  -p {{ k }}={{ v }}{% endfor %}

LimitNOFILE=131072
LimitMEMLOCK=85983232
